{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | Sachin Lad Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=JetBrains+Mono:wght@600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: #070a13;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .login-card {
      width: 100%;
      max-width: 440px;
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 1.5rem;
      padding: 2.5rem;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8), 0 0 35px rgba(56, 189, 248, 0.15);
    }
    .brand-icon {
      width: 55px;
      height: 55px;
      border-radius: 1rem;
      background: rgba(56, 189, 248, 0.15);
      border: 1px solid rgba(56, 189, 248, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #38bdf8;
      font-size: 1.5rem;
      margin-bottom: 1.5rem;
    }
    .login-title {
      font-size: 1.6rem;
      font-weight: 900;
      letter-spacing: -0.02em;
      margin-bottom: 0.35rem;
    }
    .login-sub {
      color: #94a3b8;
      font-size: 0.85rem;
      line-height: 1.4;
      margin-bottom: 1.75rem;
    }
    .form-group { margin-bottom: 1.25rem; }
    .form-label {
      display: block;
      font-size: 0.8rem;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      color: #cbd5e1;
      margin-bottom: 0.4rem;
    }
    .form-control {
      width: 100%;
      background: rgba(2, 6, 23, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 0.75rem;
      padding: 0.85rem 1rem;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s;
    }
    .form-control:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.3);
    }
    .btn-submit {
      width: 100%;
      padding: 0.85rem;
      border-radius: 0.75rem;
      background: linear-gradient(135deg, #0284c7, #2563eb);
      color: #fff;
      font-size: 0.95rem;
      font-weight: 800;
      border: none;
      cursor: pointer;
      margin-top: 1rem;
      box-shadow: 0 10px 25px rgba(2, 132, 199, 0.4);
      transition: all 0.2s;
    }
    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 30px rgba(2, 132, 199, 0.6);
    }
    .alert-error {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
      padding: 0.75rem 1rem;
      border-radius: 0.6rem;
      font-size: 0.85rem;
      margin-bottom: 1.5rem;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="brand-icon">
      <i class="fa-solid fa-key"></i>
    </div>
    <h1 class="login-title">Reset Admin Password</h1>
    <p class="login-sub">Enter your registered Email Address or Master Recovery Key to set a new password.</p>

    {% if messages %}
      {% for message in messages %}
        <div class="alert-error">{{ message }}</div>
      {% endfor %}
    {% endif %}

    <form method="POST">
      {% csrf_token %}
      <div class="form-group">
        <label class="form-label">Registered Email or Recovery Key</label>
        <input type="text" name="identifier" class="form-control" placeholder="Email or Recovery Key" required autofocus autocomplete="off" />
      </div>

      <div class="form-group">
        <label class="form-label">New Password</label>
        <input type="password" name="new_password" class="form-control" placeholder="••••••••" required autocomplete="new-password" />
      </div>

      <button type="submit" class="btn-submit">
        <i class="fa-solid fa-check"></i> Update Password & Login
      </button>
    </form>

    <div style="margin-top:1.75rem; text-align:center;">
      <a href="{% url 'admin_login' %}" style="color:#94a3b8; font-size:0.85rem; text-decoration:none;">
        <i class="fa-solid fa-arrow-left"></i> Back to Login
      </a>
    </div>
  </div>

</body>
</html>
