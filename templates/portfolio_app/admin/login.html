{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | Sachin Lad Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=JetBrains+Mono:wght@600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: #070a13;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .login-card {
      width: 100%;
      max-width: 440px;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 1.5rem;
      padding: 2.5rem;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8), 0 0 35px rgba(239, 68, 68, 0.2);
    }
    .brand-icon {
      width: 55px;
      height: 55px;
      border-radius: 1rem;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ef4444;
      font-size: 1.5rem;
      margin-bottom: 1.5rem;
    }
    .login-title {
      font-size: 1.75rem;
      font-weight: 900;
      letter-spacing: -0.02em;
      margin-bottom: 0.35rem;
    }
    .login-sub {
      color: #94a3b8;
      font-size: 0.9rem;
      margin-bottom: 2rem;
    }
    .form-group { margin-bottom: 1.25rem; }
    .form-label {
      display: block;
      font-size: 0.8rem;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      color: #cbd5e1;
      margin-bottom: 0.4rem;
    }
    .form-control {
      width: 100%;
      background: rgba(2, 6, 23, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 0.75rem;
      padding: 0.85rem 1rem;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s;
    }
    .form-control:focus {
      border-color: #ef4444;
      box-shadow: 0 0 15px rgba(239, 68, 68, 0.3);
    }
    .btn-login {
      width: 100%;
      padding: 0.85rem;
      border-radius: 0.75rem;
      background: linear-gradient(135deg, #ef4444, #e11d48);
      color: #fff;
      font-size: 0.95rem;
      font-weight: 800;
      border: none;
      cursor: pointer;
      margin-top: 1rem;
      box-shadow: 0 10px 25px rgba(239, 68, 68, 0.4);
      transition: all 0.2s;
    }
    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 30px rgba(239, 68, 68, 0.6);
    }
    .alert {
      padding: 0.75rem 1rem;
      border-radius: 0.6rem;
      font-size: 0.85rem;
      margin-bottom: 1.5rem;
    }
    .alert-error {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
    }
    .alert-success {
      background: rgba(34, 197, 94, 0.15);
      border: 1px solid rgba(34, 197, 94, 0.4);
      color: #86efac;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="brand-icon">
      <i class="fa-solid fa-shield-halved"></i>
    </div>
    <h1 class="login-title">Control Portal</h1>
    <p class="login-sub">Enter credentials to manage Sachin Lad Portfolio</p>

    {% if messages %}
      {% for message in messages %}
        <div class="alert {% if message.tags == 'success' %}alert-success{% else %}alert-error{% endif %}">{{ message }}</div>
      {% endfor %}
    {% endif %}

    <form method="POST">
      {% csrf_token %}
      <div class="form-group">
        <label class="form-label" for="username">Admin Username</label>
        <input type="text" id="username" name="username" class="form-control" placeholder="admin" required autofocus />
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required />
      </div>

      <button type="submit" class="btn-login">
        <i class="fa-solid fa-lock-open"></i> Login to Dashboard
      </button>
    </form>

    <div style="margin-top:1.5rem; display:flex; justify-content:space-between; align-items:center; font-size:0.85rem;">
      <a href="/" style="color:#94a3b8; text-decoration:none; transition:color 0.2s;" onmouseover="this.style.color='#fff'" onmouseout="this.style.color='#94a3b8'">
        <i class="fa-solid fa-arrow-left"></i> Public Portfolio
      </a>
      <a href="{% url 'admin_forgot_password' %}" style="color:#38bdf8; text-decoration:none; font-weight:600; transition:color 0.2s;" onmouseover="this.style.color='#7dd3fc'" onmouseout="this.style.color='#38bdf8'">
        <i class="fa-solid fa-key"></i> Forgot Password?
      </a>
    </div>
  </div>

</body>
</html>
